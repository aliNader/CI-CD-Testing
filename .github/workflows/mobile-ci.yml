name: mobile-ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # Job 1: build the Flutter app into an APK
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project and add our source
        run: |
          flutter create --platforms=android --project-name demo_app --org com.example.demo app
          cp app_src/lib/main.dart app/lib/main.dart

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: demo-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  # Job 2: run the Appium test on an emulator, only if the build succeeded
  ui-tests:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Get the APK from job 1
        uses: actions/download-artifact@v4
        with:
          name: demo-apk
          path: .

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Build the tests
        run: dotnet build tests/MobileTests.csproj -c Release

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the smoke test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash ci/run-tests.sh

      - name: Upload results, screenshots and Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/TestResults/**
            tests/bin/Release/**/screenshots/**
            appium.log
